diagram_requirements:
  file: map-layout.svg
  title: Ash Harbor — Authoritative Physical Layout
  canvas_viewbox: [0, 0, 1600, 1160]
  map_frame_svg: [100, 80, 1400, 1000]
  map_scale:
    meters_per_svg_unit: 10
    representative_fraction_at_native_svg_unit: technical_reference_only
  required_layers_in_order:
    - water_and_coordinate_grid
    - mainland_and_surface_zones
    - elevation_and_shallows
    - region_extents
    - roads
    - facilities
    - naval_reference_areas
    - shorelines
    - labels_and_legend
    - map_boundary_north_arrow_and_scale_bar
  required_region_labels:
    - A — Harbor District
    - B — Fuel and Ammunition Storage District
    - C — Radar Hill / Air Defense High Ground
    - D — Convoy and Rescue Corridor
    - E — Remote Beachhead
    - F — Blue Offshore Naval Group
  visual_priority:
    - coastline_and_landform
    - region_identity
    - roads_and_major_facilities
    - labels_and_scale_information
  prohibited_overlays:
    - aircraft_routes
    - missile_routes
    - landing_arrows
    - battle_phases
    - time_markers
    - explosions
    - attack_waves
    - mission_logic

validation_rules:
  coordinate_bounds:
    x_min: -7000
    x_max: 7000
    z_min: -5000
    z_max: 5000
    boundary_policy: inclusive
    require_all_geometry_inside: true
  identifiers:
    require_unique_ids_globally: true
    format: lower_snake_case
  geometry:
    polygon_closure: implicit_last_to_first
    require_valid_polygon_rings: true
    require_non_self_intersecting_major_polygons: true
    require_equal_svg_axis_scale: true
    require_north_up: true
  spatial_separation:
    harbor_to_beachhead_centroid_min_m: 8000
    harbor_to_storage_centroid_min_m: 2500
    storage_subarea_clear_gap_min_m: 250
    offshore_group_to_main_harbor_centroid_min_m: 5000
  physical_content:
    minimum_large_harbor_berths: 3
    minimum_support_harbor_berths: 1
    minimum_fuel_tanks: 6
    minimum_ammunition_bunkers: 4
    require_search_radar: true
    require_tracking_radar: true
    require_sam_area: true
    require_aaa_area: true
    require_corridor_branch: true
    require_corridor_chokepoint: true
    require_beach_shallows: true
    require_beach_exit: true
  content_exclusions:
    prohibit_gameplay_logic: true
    prohibit_event_timing: true
    prohibit_attack_routes: true
    prohibit_visible_people_requirement: true
    prohibit_visible_human_objects: true
