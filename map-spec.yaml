schema_version: '1.0.0'

metadata:
  map_id: ash_harbor
  display_name: Ash Harbor
  subtitle: Coastal military-industrial region layout
  purpose: Authoritative physical-world specification for a future 3D battlefield diorama
  scope: Terrain, shoreline, roads, facilities, and reserved naval water only
  visual_reference_period: Late Cold War to early 1990s
  fictional_location: true
  visible_human_characters_required: false
  description: >-
    A dry mainland coast wrapped around a compact northwestern naval basin, with
    a separated industrial plateau, a fortified northeastern ridge, an eastern
    road corridor, a remote southeastern landing beach, and open southwestern sea.

coordinate_system:
  type: local_cartesian
  units: meters
  origin: [0, 0, 0]
  axes:
    x_positive: east
    y_positive: up
    z_positive: north
  diagram_orientation:
    north: up
    east: right
    projection: strict_orthographic_top_down
    equal_scale: true
  svg_mapping:
    map_frame_origin_svg: [100, 80]
    map_frame_size_svg: [1400, 1000]
    meters_per_svg_unit: 10
    world_to_svg_x: '100 + (x + 7000) / 10'
    world_to_svg_y: '80 + (5000 - z) / 10'

map_bounds:
  id: map_boundary
  x_min: -7000
  x_max: 7000
  y_reference: 0
  z_min: -5000
  z_max: 5000
  size_m: [14000, 10000]
  boundary_polygon_xz:
    - [-7000, 5000]
    - [7000, 5000]
    - [7000, -5000]
    - [-7000, -5000]

environment:
  geography: coastal_mainland_with_peninsula
  climate: dry_semi_arid
  water_character: exposed_coastal_sea_with_sheltered_harbor_basin
  terrain_palette:
    - dry_soil
    - rocky_scrub
    - industrial_pavement
    - compacted_gravel
    - beach_sand
    - shallow_coastal_water
    - open_water
  vegetation:
    density: sparse
    dominant_cover: low_scrub_and_dry_grass
    dense_forest_allowed: false
    tropical_character_allowed: false
  built_character:
    harbor: dense_military_port
    industrial: dispersed_hardened_storage
    inland: sparse_service_infrastructure
    beach: minimally_developed

terrain:
  surface_precedence:
    - terrain_open_water_base
    - terrain_mainland
    - land_overlays_clipped_to_terrain_mainland
    - water_overlays_clipped_to_terrain_open_water_base
  overlap_policy: >-
    Elevation and land-surface zones are descriptive overlays and must be clipped
    to terrain_mainland. Water overlays must be clipped to the open-water portion
    remaining outside terrain_mainland.
  base_surface:
    id: terrain_open_water_base
    type: open_water
    elevation_m: 0
  landmasses:
