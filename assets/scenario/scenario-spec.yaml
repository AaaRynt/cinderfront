schema_version: '1.1.0'

metadata:
  scenario_id: 'ash_harbor_0527'
  title: 'Ash Harbor'
  scenario_type: 'deterministic_3d_battlefield_diorama'
  start_local_time: '05:27:00'
  scripted_duration_seconds: 180
  aftermath_mode: 'indefinite'
  visible_humans: false
  audio_enabled: false
  setting:
    period: 'fictional contemporary / near-modern conflict'
    equipment_policy: 'mixed-generation imported, copied, license-produced, and locally supported equipment is valid'
    historical_reenactment: false

belligerents:
  attacker:
    display_name: 'Attacker'
    operational_role: 'offshore strike and amphibious landing force'
    map_region_ids:
      - 'region_f_attacker_offshore_group'
  defender:
    display_name: 'Defender'
    operational_role: 'coastal and island defending force'
    map_region_ids:
      - 'region_a_harbor_district'
      - 'region_b_storage_district'
      - 'region_c_radar_hill'
      - 'region_d_convoy_corridor'
      - 'region_e_remote_beachhead'

source_of_truth:
  map_spec: '../map/map-spec.yaml'
  map_layout_reference: '../map/map-layout.svg'
  belligerents: '../vehicle/Belligerents.yaml'
  authoritative_scenario: 'scenario-spec.yaml'
  derived_human_view: 'scenario-timeline.md'
  authority_rules:
    geometry_and_map_ids: 'map_spec'
    vehicle_dimensions_and_roles: 'referenced vehicle YAML files'
    side_rosters: 'belligerents'
    event_timing_and_state: 'authoritative_scenario'
    visual_diagram_only: 'map_layout_reference'

streaming_generation_contract:
  transport_record_format: 'ndjson'
  partial_yaml_is_authoritative: false
  required_envelope_fields:
    - 'generation_id'
    - 'sequence'
    - 'operation'
    - 'record_id'
    - 'payload'
  sequence_starts_at: 1
  resume_from_last_acknowledged_sequence: true
  operations:
    - 'metadata.upsert'
    - 'entity.upsert'
    - 'path.upsert'
    - 'timeline_event.upsert'
    - 'aftermath.upsert'
    - 'generation.complete'
  idempotency_key: '[generation_id, sequence]'
  finalization:
    require_generation_complete_record: true
    require_yaml_parse: true
    require_reference_validation: true
    require_timeline_validation: true
    write_final_yaml_atomically: true
    regenerate_markdown_from_final_yaml: true

reference_conventions:
  belligerent_id_values: ['attacker', 'defender']
  vehicle_ref_field: 'vehicle_id'
  entity_ref_field: 'entities[].id'
  map_region_ref_field: 'map_region_id'
  map_feature_ref_field: 'map_feature_id'
  timeline_authoritative_time_field: 'at_s'
  local_time_is_derived_from: '[metadata.start_local_time, at_s]'
  timeline_event_code_field: 'event'

vehicle_references:
  attacker:
    - '../vehicle/F-35B/f-35b.yaml'
    - '../vehicle/LCAC/lcac.yaml'
    - '../vehicle/LAV-25/lav-25.yaml'
    - '../vehicle/Wasp/wasp-class.yaml'

  defender:
    - '../vehicle/Su-30MKK/su-30mkk.yaml'
    - '../vehicle/Pantsir-S1/pantsir-s1.yaml'
    - '../vehicle/T-72b/t-72b.yaml'
    - '../vehicle/BTR-80/btr-80.yaml'
    - '../vehicle/Project 12418 Molniya missile boat/project-12418-molniya.yaml'
    - '../vehicle/Talwar/talwar.yaml'

design_intent:
  primary_experience: >
    A three-minute deterministic battlefield sequence showing a coastal military-industrial
    system being progressively disrupted by a coordinated attack while surviving units attempt
    to respond, support one another, relocate, withdraw, and continue operating.

  combat_character:
    - 'The battle is intentionally asymmetric.'
    - 'The defender reacts actively instead of remaining static.'
    - 'Not every defender asset is destroyed.'
    - 'Some vehicles provide support and survive.'
    - 'Some vehicles retreat after local positions become untenable.'
    - 'Some vehicles are disabled or destroyed during movement.'
    - 'The attacker also performs visible repositioning and egress instead of remaining stationary.'
    - 'The final image should show a damaged but still active battlefield rather than a completely lifeless scene.'

  scene_density:
    principle: 'layered'
    rules:
      - 'Prefer one dominant event at a time.'
      - 'Allow two or three medium-scale supporting actions.'
      - 'Keep low-intensity background movement active.'
      - 'Do not trigger every weapon, explosion, vehicle, and environmental effect simultaneously.'

  implementation_philosophy:
    - 'Use scripted cinematic approximation instead of attempting a complete physical simulation.'
    - 'Important destruction effects should be layered and persistent.'
    - 'Vehicle motion should use deterministic paths and state transitions.'
    - 'Large effects may use procedural particles, instancing, decals, shaders, and authored response animations.'
    - 'The simulation must remain deterministic when paused, replayed, or seeked.'

simulation:
  deterministic: true
  fixed_seed: 52730

  time:
    origin_label: 'T+00:00'
    timeline_resolution_seconds: 0.1
    scripted_end_seconds: 180
    aftermath_continues_world_motion: true

  pause_behavior:
    world_simulation_pauses: true
    spectator_camera_remains_active: true
    timeline_remains_seekable: true

  seek_behavior:
    reconstruct_state_from_timeline: true
    clear_transient_particles_before_reconstruction: true
    reconstruct_persistent_damage: true
    reconstruct_fires: true
    reconstruct_smoke_sources: true
    reconstruct_vehicle_states: true

  reset_behavior:
    restore_initial_entity_states: true
    remove_generated_debris: true
    remove_ground_fire: true
    remove_smoke: true
    remove_damage_decals: true
    restore_environmental_objects: true

environment:
  time_of_day:
    description: 'early dawn'
    lighting_character:
      - 'cold ambient sky'
      - 'low warm horizon light'
      - 'industrial lights remain visible'
      - 'fire and explosions strongly influence local illumination'

  weather:
    precipitation: 'none'
    visibility: 'high with light coastal haze'
    cloud_cover: 'sparse broken clouds'

  wind:
    speed_mps: 4.0
    direction_description: 'toward the northeast'
    xz_direction_normalized: [0.70, 0.71]
    affects:
      - 'smoke columns'
      - 'small embers'
      - 'light dust'
      - 'surface fire visual drift'

  terrain_state:
    initial:
      dry_ground: true
      sparse_combustible_grass: true
      sparse_scrub: true
      industrial_surface_dry: true

    persistent_damage_allowed:
      - 'scorch marks'
      - 'craters'
      - 'localized grass fires'
      - 'soot-darkened terrain'
      - 'burned scrub'
      - 'damaged light structures'

  water_state:
    initial: 'calm coastal water with moderate surface movement'
    persistent_damage_allowed:
      - 'fuel sheen'
      - 'floating burning fuel'
      - 'localized dark contamination'
      - 'ship debris'

