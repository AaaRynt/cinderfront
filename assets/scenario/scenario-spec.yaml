      spring_return_seconds_range: [1.0, 3.0]
      slight_overshoot: true

    ground_fire:
      new_fire_patch_count_range: [6, 14]
      maximum_initial_radius_m: 180
      scripted_spread_only: true
      persistent_after_event: true

    smoke:
      dense_black_column: true
      initial_fast_growth: true
      minimum_persistence_seconds: 90
      wind_drift: true
      layered_density: true

    persistent_environment:
      scorched_ground: true
      soot_deposition_visual: true
      burned_scrub: true
      localized_surface_fire: true

  ammunition_storage_cookoff:
    category: 'hero'
    cinematic_approximation_allowed: true

    prelude:
      small_explosion_count_range: [5, 9]
      interval_seconds_range: [0.4, 1.8]
      intermittent_flashes: true
      smoke_accumulation: true

    primary_detonation:
      fireball_radius_m_range: [40, 65]
      shock_front_radius_m_range: [400, 550]
      sharp_flash: true
      dust_ring: true

    debris:
      count_range: [18, 34]
      high_arc_fragments: true
      flaming_fraction_range: [0.30, 0.55]
      ember_trails: true
      fragment_lifetime_seconds_range: [3.0, 9.0]

    persistent_environment:
      multiple_small_fires: true
      crater_or_destroyed_compound_visual: true
      heavy_smoke: true
      intermittent_secondary_detonations: true

  harbor_fuel_fire:
    category: 'persistent'
    requirements:
      expanding_fuel_sheen: true
      irregular_surface_fire: true
      dark_surface_contamination: true
      drifting_smoke: true
      floating_debris: true
      slow_visual_spread: true

environmental_response_rules:
  shock_response:
    physical_simulation_required: false
    authored_response_allowed: true
    shader_response_allowed: true
    instanced_object_response_allowed: true

  vegetation:
    full_map_simulation: false
    only_near_hero_explosions: true
    bend_and_rebound_required: true
    local_ground_ignition_allowed: true

  structures:
    complete_destructibility_required: false
    selected_breakable_components_allowed:
      - 'light poles'
      - 'small antennas'
      - 'fence sections'
      - 'small roof panels'
      - 'selected industrial props'

  contamination_visuals:
    enabled: true
    types:
      - 'oil sheen on harbor water'
      - 'black smoke'
      - 'soot-darkened ground'
      - 'burned vegetation'
      - 'localized ground fire'
      - 'industrial haze'

timeline_event_contract:
  required_fields:
    - 'id'
    - 'at_s'
    - 'local_time'
    - 'track'
    - 'event'
  participant_fields:
    singular: 'entity'
    plural: 'entities'
  optional_reference_fields:
    - 'source_entity_id'
    - 'target_entity_id'
    - 'target_map_region_id'
    - 'target_map_feature_id'
    - 'path_id'
    - 'path_ids'
    - 'path_direction'
    - 'effect_profile'
    - 'resulting_state'
  ordering: 'ascending_at_s_then_document_order'
  duplicate_event_ids_allowed: false
  same_timestamp_events_allowed: true
  at_s_range_inclusive: [0, 180]
  local_time_validation: 'metadata.start_local_time + at_s'
  unknown_entity_or_path_refs_allowed: false

