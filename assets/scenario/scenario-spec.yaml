aftermath:
  label: 'AFTERMATH OBSERVATION'

  global:
    new_major_strikes: false
    world_motion_continues: true

  harbor:
    talwar:
      state: 'heavily listed, partially flooded, burning'
    molniya:
      state: 'damaged withdrawal continues'
    water:
      state:
        - 'fuel sheen'
        - 'localized burning fuel'
        - 'floating debris'

  industrial:
    state:
      - 'large smoke column'
      - 'multiple ground fires'
      - 'occasional minor secondary detonation'
      - 'scorched terrain'
      - 'damaged storage infrastructure'

  radar_hill:
    state:
      - 'primary radar disabled'
      - 'some secondary equipment remains active'
      - 'smoke and local fires continue'

  convoy_corridor:
    state:
      - 'one Pantsir-S1 wreck'
      - 'one BTR-80 wreck or disabled hull'
      - 'one T-72B wreck'
      - 'surviving armored vehicles withdrawing'
      - 'rescue vehicles halted or reversing'

  remote_beach:
    state:
      - 'both LCAC remain at or near the shoreline'
      - 'LAV-25 vehicles continue disembarking and moving inland'
      - 'dust and hovercraft spray gradually settle'

  offshore:
    state:
      - 'Wasp remains underway'
      - 'main aircraft strike has exited the immediate battlespace'

acceptance_requirements:
  data_integrity:
    - 'Only attacker and defender are valid side IDs.'
    - 'Every vehicle_id resolves to exactly one referenced vehicle YAML file and matches its game_role.'
    - 'Every map_region_id and map_feature_id resolves in map-spec.yaml.'
    - 'Every entity, path, track, and effect reference resolves.'
    - 'Timeline event IDs are unique and events are ordered by at_s.'
    - 'Every local_time equals metadata.start_local_time plus at_s.'
    - 'Payload counts and planned loss totals match their owning entity counts.'
    - 'A streamed generation is publishable only after generation.complete and full validation.'
    - 'scenario-timeline.md is regenerated from the validated scenario-spec.yaml snapshot.'

  scenario:
    - 'The full scripted phase lasts exactly 180 seconds.'
    - 'All major events use deterministic timing.'
    - 'The scene remains visually active after T+03:00.'
    - 'No visible human figures are required.'
    - 'No sound system is required in this stage.'

  vehicle_behavior:
    - 'Vehicles must not behave as static props.'
    - 'At least one defender naval asset attempts withdrawal.'
    - 'At least one defender aircraft performs reinforcement and withdrawal.'
    - 'At least one defender armored group attempts reinforcement.'
    - 'Surviving armored vehicles react to losses by falling back.'
    - 'Support and rescue vehicles attempt to reach damaged infrastructure.'
    - 'The support attempt must visibly fail because of battlefield conditions.'
    - 'Both LCAC craft perform visible approach, beaching, and unloading.'
    - 'LAV-25 vehicles continue moving after disembarkation.'
    - 'F-35B aircraft visibly leave the main combat area after completing their tasks.'

  destruction:
    - 'Destroyed vehicles remain as persistent wrecks.'
    - 'Major ship damage progresses over time instead of occurring as a single state change.'
    - 'Hero explosions include multiple visual layers rather than a single particle burst.'
    - 'Hero explosion shock fronts cause visible local environmental response.'
    - 'Selected burning debris must leave short visible ember or flame trails.'
    - 'Important fire and smoke sources persist into the aftermath.'
    - 'Industrial and harbor contamination remains visible after the initial explosions.'

  performance:
    - 'Use simplified procedural geometry and instancing where detailed modeling is not visually important.'
    - 'Reserve the highest effect density for hero events.'
    - 'Use pooled particles and reusable transient objects.'
    - 'Do not require global real-time destruction physics.'
