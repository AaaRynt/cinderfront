schema_version: '1.2.0'

metadata:
  map_id: ash_harbor
  display_name: Ash Harbor
  revision: setting_language_correction_v1_2
  subtitle: Coastal military-industrial region layout
  purpose: Authoritative physical-world specification for a future 3D battlefield diorama
  scope: Terrain, shoreline, roads, facilities, and reserved naval water only
  setting_reference_period: Fictional contemporary / near-modern; not tied to a single historical year
  setting_frame: Fictional contemporary coastal military-industrial battlespace with mixed-generation imported and locally supported equipment
  equipment_context: >-
    Imported, license-produced, locally copied, hybrid, and older operational
    systems may coexist; the offshore force may field newer systems.
  force_naming_policy: Use neutral functional and geographic labels without rigid red-versus-blue visual framing.
  force_asymmetry: Allowed; same-era matching, gameplay balance, and strict procurement realism are not required.
  fictional_location: true
  visible_human_characters_required: false
  description: >-
    A dry mainland coast wrapped around a compact northwestern naval basin, with
    a separated industrial plateau, a fortified northeastern ridge, an eastern
    road corridor, a remote southeastern landing beach, and open southwestern sea.

geometry_conventions:
  plan_coordinate_order: [x, z]
  polygon_closure: implicit_last_to_first
  heading_degrees:
    zero: north_positive_z
    positive_direction: clockwise_when_viewed_from_above
  vertical_placement: terrain_relative_unless_explicit
  diagram_visibility_values:
    prominent: show_as_primary_technical_geometry
    subtle: show_without_individual_label
    yaml_only: omit_from_svg_but_retain_for_3d_construction
  diagram_representation_values:
    exact: SVG uses the authoritative geometry directly.
    symbolic: SVG uses a centered technical symbol while YAML retains exact construction geometry.
    grouped: SVG combines a dense family of related leaf objects under the parent ID.
  diagram_correspondence_rule: Prominent and subtle features must have an SVG element by their own ID or by a declared parent group; yaml_only features must not appear as standalone SVG geometry.
  nested_feature_ownership: Every nested feature declares its own region_id and optional subregion_id.

coordinate_system:
  type: local_cartesian
  units: meters
  origin: [0, 0, 0]
  axes:
    x_positive: east
    y_positive: up
    z_positive: north
  diagram_orientation:
    north: up
    east: right
    projection: strict_orthographic_top_down
    equal_scale: true
  svg_mapping:
    map_frame_origin_svg: [100, 80]
    map_frame_size_svg: [1400, 1000]
    meters_per_svg_unit: 10
    world_to_svg_x: '100 + (x + 7000) / 10'
    world_to_svg_y: '80 + (5000 - z) / 10'

map_bounds:
  id: map_boundary
  type: rectangular_map_boundary
  diagram_visibility: prominent
  x_min: -7000
  x_max: 7000
  y_reference: 0
  z_min: -5000
  z_max: 5000
  size_m: [14000, 10000]
  boundary_polygon_xz:
    - [-7000, 5000]
    - [7000, 5000]
    - [7000, -5000]
    - [-7000, -5000]

environment:
  geography: coastal_mainland_with_peninsula
  climate: dry_semi_arid
  water_character: exposed_coastal_sea_with_sheltered_harbor_basin
  terrain_palette:
    - dry_soil
    - rocky_scrub
    - industrial_pavement
    - compacted_gravel
    - beach_sand
    - shallow_coastal_water
    - open_water
  vegetation:
    density: sparse
    dominant_cover: low_scrub_and_dry_grass
    dense_forest_allowed: false
    tropical_character_allowed: false
  built_character:
    harbor: dense_military_port
    industrial: dispersed_hardened_storage
    inland: sparse_service_infrastructure
    beach: minimally_developed

terrain:
  surface_precedence:
    - terrain_open_water_base
    - terrain_mainland
    - land_overlays_clipped_to_terrain_mainland
    - water_overlays_clipped_to_terrain_open_water_base
  elevation_zone_resolution: Nested elevation envelopes apply from broadest to smallest; the innermost containing envelope supplies the local elevation band.
  overlap_policy: >-
    Elevation and land-surface zones are descriptive overlays and must be clipped
    to terrain_mainland. Water overlays must be clipped to the open-water portion
    remaining outside terrain_mainland.
